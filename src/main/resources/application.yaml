server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: blog-backend
  profiles:
    active: dev   # 默认激活 dev，部署时改为 prod

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      # 单个文件最大大小
      max-file-size: 10MB
      # 请求总大小最大值
      max-request-size: 20MB
      enabled: true
      # 文件写入磁盘的阈值
      file-size-threshold: 2KB

  # ==================== Spring AI 配置 (MiMo OpenAI 兼容) ====================
  ai:
    openai:
      base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com}
      api-key: ${MIMO_API_KEY:YOUR_API_KEY}
      chat:
        options:
          model: ${MIMO_MODEL:mimo-v2.5-pro}
          temperature: 0.7
          max-tokens: 4096

# ==================== 阿里云 OSS 配置 ====================
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:YOUR_ACCESS_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:YOUR_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:b1og}
    url-prefix: ${OSS_URL_PREFIX:https://b1og.oss-cn-beijing.aliyuncs.com}

# ==================== MyBatis 配置 ====================
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# ==================== PageHelper 分页配置 ====================
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ==================== Sa-Token 配置 ====================
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400           # token 有效期（秒）24小时
  active-timeout: 7200     # 无操作超时 2 小时
  is-concurrent: true      # 是否允许同一账号并发登录
  is-share: true           # 多端登录共享同一 token
  token-style: uuid
  is-log: false
  is-read-cookie: false    # 不从 cookie 读取 token
  is-read-header: true     # 从 header 读取 token

# ==================== Knife4j 文档配置 ====================
# 访问 http://localhost:8080/swagger-ui/index.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 访问 http://localhost:8080/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn