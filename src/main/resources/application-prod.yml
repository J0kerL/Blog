# ==================== 生产环境配置 ====================

spring:

  # 数据源（生产 MySQL）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/blog_new?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  # Redis（生产）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms

# 日志（生产环境仅输出 warn 以上）
logging:
  level:
    root: warn
    com.blog: info

# 生产环境禁止访问文档
springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false